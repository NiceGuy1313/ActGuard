[project]
name = "actguard"
version = "0.1.0"
description = "Pre-execution action auditing against indirect prompt injection in LLM agents"
dependencies = [
    "openai>=1.59.7",
    "pydantic[email]>=2.7.1",
    "docstring-parser>=0.15",
    "tenacity>=8.2.3",
    "typing-extensions>=4.11.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "deepdiff>=8.6.1",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "openpyxl>=3.1.0",
]
readme = "README.md"
requires-python = ">= 3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Environment :: GPU",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = ["prompt injection", "LLM agents", "security", "action auditing"]

[project.scripts]
actguard-benchmark = "agentdojo.scripts.benchmark:main"
actguard-trace = "agentdojo.reflective_audit_trace:main"

[project.optional-dependencies]
actguard = ["transformers>=4.41.2", "torch>=2.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "types-pyyaml>=6.0.12.20240311",
    "pyright>=1.1.362",
]

[tool.uv]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentdojo"]

[tool.ruff]
line-length = 120
exclude = ["**/experimental", "**/notebooks"]
# include = ["src/", "examples/", "scripts/", "tests/"]

[tool.ruff.lint]
ignore = []
select = [
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "ERA", # eradicate
    "NPY", # numpy
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/agentdojo/agent_pipeline/reflective_audit.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_agent_pipeline/test_reflective_audit.py" = ["RUF012"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
ignore = ["**/experimental/**"]
line-length = 120
